[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ruoyi-robot-simulator"
version = "0.1.0"
description = "Protocol-faithful MQTT robot simulator for the RuoYi Robot platform"
requires-python = ">=3.11"
dependencies = ["paho-mqtt>=2.1,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
ruoyi-robot-simulator = "ruoyi_robot_simulator.simulator:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["ruoyi_robot_simulator*"]
