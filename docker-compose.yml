name: robot-platform

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: robot_platform
      MYSQL_USER: robot_platform
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # The official MySQL entrypoint executes these only on a fresh volume.
      - ./sql/mysql/ruoyi-vue-pro.sql:/docker-entrypoint-initdb.d/01-framework.sql:ro
      - ./sql/mysql/quartz.sql:/docker-entrypoint-initdb.d/02-quartz.sql:ro
      - ./sql/mysql/robot-platform.sql:/docker-entrypoint-initdb.d/03-robot.sql:ro
      - ./sql/mysql/ai-platform.sql:/docker-entrypoint-initdb.d/04-ai.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $$MYSQL_USER -D $$MYSQL_DATABASE -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  emqx:
    image: emqx/emqx:5.8.4
    environment:
      EMQX_NODE__COOKIE: ${EMQX_NODE_COOKIE:?Set EMQX_NODE_COOKIE}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:?Set EMQX_DASHBOARD_PASSWORD}
      # Passed unchanged to base.hocon for both callback endpoints; never use this for MQTT clients.
      MQTT_CALLBACK_TOKEN: ${MQTT_CALLBACK_TOKEN:?Set MQTT_CALLBACK_TOKEN for both EMQX and the backend}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:1883:1883"
      - "127.0.0.1:8883:8883"
      - "127.0.0.1:18083:18083"
    volumes:
      - ./docker/emqx/base.hocon:/opt/emqx/etc/base.hocon:ro
      - emqx-data:/opt/emqx/data
      - emqx-log:/opt/emqx/log
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

volumes:
  mysql-data:
  redis-data:
  emqx-data:
  emqx-log:
