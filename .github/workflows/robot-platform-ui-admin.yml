name: RuoYi Robot Admin CI

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  TZ: Asia/Shanghai

defaults:
  run:
    shell: bash
    working-directory: robot-platform-ui-admin

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: pnpm
          cache-dependency-path: robot-platform-ui-admin/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build:prod
