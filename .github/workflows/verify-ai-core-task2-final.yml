name: Verify AI Core Task 2 Full

on:
  push:
    branches: [verify/realtime-agent-core-task2-final]

permissions:
  contents: read

jobs:
  ai-core-task2-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Run Task 2 full module tests
        run: mvn -B -pl robot-platform-module-ai -am test
