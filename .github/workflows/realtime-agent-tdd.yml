name: Realtime Agent TDD

on:
  push:
    branches:
      - ci/realtime-agent-tdd

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Run current TDD verification
        run: bash .ci/realtime-agent-test.sh
