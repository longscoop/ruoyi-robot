name: Realtime Agent Task 2 TDD

on:
  push:
    branches:
      - verify/realtime-agent-core-task2-tdd

jobs:
  task2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Install reactor dependencies without tests
        run: mvn -pl robot-platform-module-ai -am -Dmaven.test.skip=true install
      - name: Focused Task 2 contract test
        run: mvn -pl robot-platform-module-ai -Dtest=AiCoreSchemaContractTest test
      - name: Full AI module verification
        run: mvn -pl robot-platform-module-ai -am test
