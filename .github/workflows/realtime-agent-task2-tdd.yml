name: Realtime Agent Task 2 TDD

on:
  push:
    branches:
      - verify/realtime-agent-core-task2-tdd

permissions:
  contents: write

jobs:
  task2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Implement Task 2
        run: python3 .github/scripts/realtime-agent-task2-implement.py
      - name: Install reactor dependencies without tests
        run: mvn -pl robot-platform-module-ai -am -Dmaven.test.skip=true install
      - name: Focused Task 2 contract test
        run: mvn -pl robot-platform-module-ai -Dtest=AiCoreSchemaContractTest test
      - name: Full AI module verification
        run: mvn -pl robot-platform-module-ai -am test
      - name: Self-check Task 2 diff
        run: |
          git diff --check
          python3 .github/scripts/realtime-agent-task2-implement.py --check
          git status --short
      - name: Commit verified Task 2 implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sql/mysql/robot-platform.sql robot-platform-module-ai/src/main/java
          git diff --cached --check
          git commit -m 'feat(ai): add core ai persistence model [skip ci]'
          git push origin HEAD:verify/realtime-agent-core-task2-tdd
