      - name: Install reactor dependencies without tests
        run: mvn -pl robot-platform-module-ai -am -Dmaven.test.skip=true install
      - name: Focused Task 2 contract test
        run: mvn -pl robot-platform-module-ai -Dtest=AiCoreSchemaContractTest test
      - name: Full AI module verification
        run: mvn -pl robot-platform-module-ai -am test
      - name: Self-check Task 2 diff
        shell: bash
        run: |
          git diff --check
          python3 <<'PY'
          from pathlib import Path

          sql = Path('sql/mysql/robot-platform.sql').read_text(encoding='utf-8')
          required_tables = ['ai_model_provider', 'ai_model', 'ai_prompt', 'ai_agent', 'ai_agent_robot']
          required_unique_keys = [
              'uk_ai_provider_tenant_code',
              'uk_ai_model_tenant_provider_code',
              'uk_ai_prompt_tenant_code_version',
              'uk_ai_agent_tenant_code',
              'uk_ai_agent_robot',
              'idx_ai_agent_robot_default',
          ]
          for table in required_tables:
              assert f'CREATE TABLE IF NOT EXISTS `{table}`' in sql, table
          for key in required_unique_keys:
              assert f'`{key}`' in sql, key
          assert '`api_key_ciphertext`' in sql
          assert '`api_key` varchar' not in sql

          java_root = Path('robot-platform-module-ai/src/main/java/com/robot/platform/ai')
          expected = [
              java_root / 'model/dal/dataobject/AiModelProviderDO.java',
              java_root / 'model/dal/dataobject/AiModelDO.java',
              java_root / 'prompt/dal/dataobject/AiPromptDO.java',
              java_root / 'agent/dal/dataobject/AiAgentDO.java',
              java_root / 'agent/dal/dataobject/AiAgentRobotDO.java',
              java_root / 'model/dal/mysql/AiModelProviderMapper.java',
              java_root / 'model/dal/mysql/AiModelMapper.java',
              java_root / 'prompt/dal/mysql/AiPromptMapper.java',
              java_root / 'agent/dal/mysql/AiAgentMapper.java',
              java_root / 'agent/dal/mysql/AiAgentRobotMapper.java',
          ]
          for path in expected:
              assert path.exists(), path
              text = path.read_text(encoding='utf-8')
              assert 'tenantId' in text or 'TenantId' in text, path
          assert 'apiKeyCiphertext' in expected[0].read_text(encoding='utf-8')
          assert 'apiKey;' not in expected[0].read_text(encoding='utf-8')
          PY
